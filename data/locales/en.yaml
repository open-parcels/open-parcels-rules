# yaml-language-server: $schema=../../schema/locale.schema.json
#
# English delivery-date phrases, as seen on shop order pages, carrier pages and shipping mails.
lang: en
months:
  - [january, jan]
  - [february, feb]
  - [march, mar]
  - [april, apr]
  - [may]
  - [june, jun]
  - [july, jul]
  - [august, aug]
  - [september, sept, sep]
  - [october, oct]
  - [november, nov]
  - [december, dec]
weekdays:
  - [monday, mon]
  - [tuesday, tues, tue]
  - [wednesday, wed]
  - [thursday, thurs, thur, thu]
  - [friday, fri]
  - [saturday, sat]
  - [sunday, sun]
past_days:
  today: 0
  yesterday: -1
relative_days:
  today: 0
  tonight: 0
  tomorrow: 1
  yesterday: -1
  day after tomorrow: 2
lead_ins:
  - arriving
  - now arriving
  - arrives
  - arrive
  - expected
  - estimated delivery
  - delivery
  - delivered by
  - deliver
  - due
  - coming
  - out for delivery
  - will be delivered
  - should arrive
range_separators: [to, and, through, until]
window_openers: [between, from]
deadline_words: [by, before, no later than]
point_words: [at, around]
hour_words: ["o'clock"]
am_markers: [am, a.m.]
pm_markers: [pm, p.m.]
negatives:
  - "^delivered"
  - "(?:was|has been|have been) delivered"
  - "delivery (?:was )?attempted"
  - "could not be delivered"
  - "not (?:be )?delivered"
  - "delayed until further notice"
  - "^cancelled"
  - "^return"
cut_markers:
  - "previously expected"
  - "originally expected"
  - "was expected"
tracking_keywords:
  - tracking number
  - tracking numbers
  - tracking no
  - tracking id
  - tracking ids
  - tracking code
  - tracking codes
  - track your package
  - track your packages
  - track your parcel
  - track your parcels
  - shipment number
  - shipment numbers
  - parcel number
  - parcel numbers
  - consignment number
  - consignment numbers
tests:
  # Whole days.
  - {
      text: "Arriving today",
      now: "2026-10-25T08:00:00+01:00",
      time_zone: Europe/Berlin,
      expect: { from: "2026-10-25T00:00:00+02:00", to: "2026-10-26T00:00:00+01:00", all_day: true },
    }
  - {
      text: "Arriving tomorrow",
      now: "2026-10-25T08:00:00+01:00",
      time_zone: Europe/Berlin,
      expect: { from: "2026-10-26T00:00:00+01:00", to: "2026-10-27T00:00:00+01:00", all_day: true },
    }
  - {
      text: "Arriving Oct 27",
      now: "2026-10-25T08:00:00Z",
      time_zone: UTC,
      expect: { from: "2026-10-27T00:00:00+00:00", to: "2026-10-28T00:00:00+00:00", all_day: true },
    }
  - {
      text: "Arriving Oct 27-29",
      now: "2026-10-25T08:00:00Z",
      time_zone: UTC,
      expect: { from: "2026-10-27T00:00:00+00:00", to: "2026-10-30T00:00:00+00:00", all_day: true },
    }
  - {
      text: "Arriving Oct 30 - Nov 2",
      now: "2026-10-25T08:00:00Z",
      time_zone: UTC,
      expect: { from: "2026-10-30T00:00:00+00:00", to: "2026-11-03T00:00:00+00:00", all_day: true },
    }
  - {
      text: "Arriving Jan 3",
      now: "2026-10-25T08:00:00Z",
      time_zone: UTC,
      expect: { from: "2027-01-03T00:00:00+00:00", to: "2027-01-04T00:00:00+00:00", all_day: true },
    }
  - {
      text: "Arriving 20 November",
      now: "2026-10-25T08:00:00Z",
      time_zone: UTC,
      expect: { from: "2026-11-20T00:00:00+00:00", to: "2026-11-21T00:00:00+00:00", all_day: true },
    }
  - {
      text: "Arriving 20 November - 18 December",
      now: "2026-10-25T08:00:00Z",
      time_zone: UTC,
      expect: { from: "2026-11-20T00:00:00+00:00", to: "2026-12-19T00:00:00+00:00", all_day: true },
    }
  - {
      text: "Arriving 3 - 5 December",
      now: "2026-11-18T08:00:00Z",
      time_zone: UTC,
      expect: { from: "2026-12-03T00:00:00+00:00", to: "2026-12-06T00:00:00+00:00", all_day: true },
    }
  - {
      text: "Arriving 3–5 December",
      now: "2026-11-18T08:00:00Z",
      time_zone: UTC,
      expect: { from: "2026-12-03T00:00:00+00:00", to: "2026-12-06T00:00:00+00:00", all_day: true },
    }
  - {
      text: "Arriving 30 December — 2 January",
      now: "2026-10-25T08:00:00Z",
      time_zone: UTC,
      expect: { from: "2026-12-30T00:00:00+00:00", to: "2027-01-03T00:00:00+00:00", all_day: true },
    }
  - {
      text: "Arriving Wednesday",
      now: "2026-10-25T08:00:00Z",
      time_zone: UTC,
      expect: { from: "2026-10-28T00:00:00+00:00", to: "2026-10-29T00:00:00+00:00", all_day: true },
    }
  - {
      text: "Arriving Sunday",
      now: "2026-10-25T08:00:00Z",
      time_zone: UTC,
      expect: { from: "2026-10-25T00:00:00+00:00", to: "2026-10-26T00:00:00+00:00", all_day: true },
    }
  - {
      text: "Your parcel will be delivered on Friday, 20 November",
      now: "2026-11-18T08:00:00Z",
      time_zone: Europe/London,
      expect: { from: "2026-11-20T00:00:00+00:00", to: "2026-11-21T00:00:00+00:00", all_day: true },
    }
  - {
      text: "Expected delivery: November 20, 2026",
      now: "2026-11-18T08:00:00Z",
      time_zone: America/New_York,
      expect: { from: "2026-11-20T00:00:00-05:00", to: "2026-11-21T00:00:00-05:00", all_day: true },
    }
  - {
      text: "Estimated delivery Dec. 3rd",
      now: "2026-11-18T08:00:00Z",
      time_zone: UTC,
      expect: { from: "2026-12-03T00:00:00+00:00", to: "2026-12-04T00:00:00+00:00", all_day: true },
    }
  - {
      text: "Arriving yesterday",
      now: "2026-11-18T08:00:00Z",
      time_zone: UTC,
      expect: { from: "2026-11-17T00:00:00+00:00", to: "2026-11-18T00:00:00+00:00", all_day: true },
    }
  - {
      text: "Arriving 17 November",
      now: "2026-11-18T08:00:00Z",
      time_zone: UTC,
      expect: { from: "2026-11-17T00:00:00+00:00", to: "2026-11-18T00:00:00+00:00", all_day: true },
    }
  - {
      text: "Arriving 16 November",
      now: "2026-11-18T08:00:00Z",
      time_zone: UTC,
      expect: { from: "2027-11-16T00:00:00+00:00", to: "2027-11-17T00:00:00+00:00", all_day: true },
    }
  # Time windows.
  - {
      text: "Arriving today 3 pm - 6 pm",
      now: "2026-11-18T08:00:00Z",
      time_zone: Europe/Berlin,
      expect:
        { from: "2026-11-18T15:00:00+01:00", to: "2026-11-18T18:00:00+01:00", all_day: false },
    }
  - {
      text: "Now arriving today 3 pm – 6 pm",
      now: "2026-10-24T09:30:00Z",
      time_zone: Europe/Paris,
      expect:
        { from: "2026-10-24T15:00:00+02:00", to: "2026-10-24T18:00:00+02:00", all_day: false },
    }
  - {
      text: "Arriving today 11:00 AM - 1:15 PM",
      now: "2026-11-18T08:00:00Z",
      time_zone: UTC,
      expect:
        { from: "2026-11-18T11:00:00+00:00", to: "2026-11-18T13:15:00+00:00", all_day: false },
    }
  - {
      text: "Arriving tomorrow 11am - 1pm",
      now: "2026-10-24T11:30:00Z",
      time_zone: Europe/Berlin,
      expect:
        { from: "2026-10-25T11:00:00+01:00", to: "2026-10-25T13:00:00+01:00", all_day: false },
    }
  - {
      text: "Arriving today 2 - 4:30 PM",
      now: "2026-11-18T08:00:00Z",
      time_zone: UTC,
      expect:
        { from: "2026-11-18T14:00:00+00:00", to: "2026-11-18T16:30:00+00:00", all_day: false },
    }
  - {
      text: "Arriving today 10 - 1 pm",
      now: "2026-11-18T08:00:00Z",
      time_zone: UTC,
      expect:
        { from: "2026-11-18T10:00:00+00:00", to: "2026-11-18T13:00:00+00:00", all_day: false },
    }
  - {
      text: "Your driver will deliver between 2 and 4 pm today",
      now: "2026-11-18T08:00:00Z",
      time_zone: UTC,
      expect:
        { from: "2026-11-18T14:00:00+00:00", to: "2026-11-18T16:00:00+00:00", all_day: false },
    }
  - {
      text: "Arriving today by 9 pm",
      now: "2026-11-18T08:00:00Z",
      time_zone: UTC,
      expect:
        { from: "2026-11-18T00:00:00+00:00", to: "2026-11-18T21:00:00+00:00", all_day: false },
    }
  - {
      text: "Out for delivery, expected at 3:45 pm",
      now: "2026-11-18T08:00:00Z",
      time_zone: UTC,
      expect:
        { from: "2026-11-18T15:45:00+00:00", to: "2026-11-18T15:45:00+00:00", all_day: false },
    }
  - {
      text: "Arriving Friday 9:00 - 12:00",
      now: "2026-11-18T08:00:00Z",
      time_zone: UTC,
      expect:
        { from: "2026-11-20T09:00:00+00:00", to: "2026-11-20T12:00:00+00:00", all_day: false },
    }
  - {
      text: "Arriving Nov 20 2 PM - 4 PM. Previously expected Nov 18",
      now: "2026-11-18T08:00:00Z",
      time_zone: UTC,
      expect:
        { from: "2026-11-20T14:00:00+00:00", to: "2026-11-20T16:00:00+00:00", all_day: false },
    }
  # Not an arrival.
  - { text: "Delivered today", now: "2026-11-18T08:00:00Z", time_zone: UTC, expect: null }
  - {
      text: "Your package was delivered on 17 November",
      now: "2026-11-18T08:00:00Z",
      time_zone: UTC,
      expect: null,
    }
  - { text: "Delivery attempted today", now: "2026-11-18T08:00:00Z", time_zone: UTC, expect: null }
  - { text: "Arriving soon", now: "2026-11-18T08:00:00Z", time_zone: UTC, expect: null }
  - { text: "Arriving Feb 31", now: "2026-11-18T08:00:00Z", time_zone: UTC, expect: null }
  - { text: "Arriving 31 February", now: "2026-11-18T08:00:00Z", time_zone: UTC, expect: null }
  - { text: "Today only: 20% off", now: "2026-11-18T08:00:00Z", time_zone: UTC, expect: null }
  - {
      text: "Arriving today 6 pm - 3 pm",
      now: "2026-11-18T08:00:00Z",
      time_zone: UTC,
      expect: null,
    }
  - { text: "Call us from 9 to 5", now: "2026-11-18T08:00:00Z", time_zone: UTC, expect: null }
