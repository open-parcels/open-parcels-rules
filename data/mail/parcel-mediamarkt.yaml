# yaml-language-server: $schema=../../schema/mail-rule.schema.json
id: parcel-mediamarkt
name: MediaMarkt delivery notices
kind: parcel
senders:
  addresses: [info@lieferung.mediamarkt.de, onlineshop@mediamarkt.de]
subject:
  - "bald bei dir|versandbestätigung|zugestellt|unterwegs"
carrier_from: carrier
extractors: [detect_tracking_numbers]
extract:
  tracking_number:
    - pattern: '[?&](?:piececode|idc)=(?<tracking_number>[A-Z0-9]{10,30})\b'
      in: [text, html]
  carrier:
    - pattern: '(?:durch|mit|von) (?<carrier>DHL|Deutsche Post|Hermes|DPD|GLS|UPS)\b'
  order_number:
    - pattern: '(?:bestellung(?:snummer)?|bestellnr\.?)\s*:?\s*\(?(?<order_number>\d{8,9})\b'
  arrival:
    - pattern: '(?<arrival>voraussichtlich am [^\n]{4,40})'
      in: [text]
status_keywords:
  - status: delivered
    patterns: ["wurde zugestellt"]
    in: [subject]
default_status: in_transit
require: [tracking_number]
tests:
  - fixture: mediamarkt-soon.eml
    expect:
      - ruleId: order-mediamarkt
      - ruleId: parcel-mediamarkt
        status: in_transit
        trackingNumbers: ["340011223348"]
