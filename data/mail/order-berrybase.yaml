# yaml-language-server: $schema=../../schema/mail-rule.schema.json
id: order-berrybase
name: BerryBase order confirmations and shipments
kind: order
senders:
  domains: [sertronics.shop, berrybase.de]
  local_parts: [noreply, info, bestellungen, shop, versand]
extract:
  order_number:
    - pattern: '(?:bestellung(?:snummer)?|auftrag(?:snummer)?|order(?: no\.?)?|#)\s*:?\s*(?<order_number>\d{5,9})\b'
event_keywords:
  - event: order_cancelled
    patterns: ["storniert|cancell?ed"]
    in: [subject]
  # "wurde zugestellt", "wurde an eine Packstation geliefert", "wurde in eine Filiale geliefert";
  # "wird voraussichtlich heute geliefert" is still on its way.
  - event: order_delivered
    patterns:
      [
        "wurde (?:an eine packstation |in eine filiale |an einen paketshop )?(?:zugestellt|geliefert)|was delivered",
      ]
    in: [subject]
  - event: order_shipped
    patterns: ["versandt|versendet|shipped|voraussichtlich heute"]
    in: [subject]
  - event: order_confirmed
    patterns: ["eingangsbestätigung|bestellbestätigung|bestellung|order confirmation"]
    in: [subject]
require: [order_number]
tests:
  - fixture: berrybase-order.eml
    expect:
      - ruleId: order-berrybase
        kind: order
        event: order_confirmed
        orderNumbers: ["1234567"]
  - fixture: berrybase-delivered.eml
    expect:
      - ruleId: order-berrybase
        event: order_delivered
        orderNumbers: ["1234568"]
  - fixture: berrybase-arriving-today.eml
    expect:
      - ruleId: order-berrybase
        event: order_shipped
        orderNumbers: ["1234568"]
