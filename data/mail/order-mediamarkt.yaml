# yaml-language-server: $schema=../../schema/mail-rule.schema.json
id: order-mediamarkt
name: MediaMarkt online orders (delivery and store pickup)
kind: order
senders:
  addresses: [no_reply@mediamarkt.de, onlineshop@mediamarkt.de, info@lieferung.mediamarkt.de]
subject:
  - "bestellung|rechnung|abhol|stornierung"
exclude:
  - "ihre anfrage|meinung"
extract:
  # What the order costs in total.
  total:
    - pattern: 'rechnungssumme:?\s*(?<total>(?:[€$£]|EUR|USD|GBP)?[ \t]?\d[\d.,]*(?:[ \t]?(?:[€$£]|EUR|USD|GBP)){0,2})'
  order_number:
    - pattern: '(?:bestellung(?:snummer)?|bestellnr\.?)\s*:?\s*\(?(?<order_number>\d{8,9})\b'
  item:
    # Older table: "1 2317003 [availability] NAME [price EUR] [sum EUR]" on one line.
    - pattern: '^\d+ \d{6,8} (?:[^\n]*?(?:werktagen|abholbestätigung) )?(?<item>[^\s\d][^\n]{2,119}?)(?: [\d.,]+ EUR)*[ \t]*$'
      flags: [i, m]
      in: [text]
    # Newer layout: quantity and article number, the name on the next line.
    - pattern: '^\d+ \d{6,8}[ \t]*\n(?<item>[^\s\d][^\n]{2,119}?)[ \t]*$'
      flags: [i, m]
      in: [text]
event_keywords:
  - event: order_cancelled
    patterns: ["stornierung|storniert"]
    in: [subject]
  - event: order_shipped
    patterns: ["versandbestätigung|bald bei dir|unterwegs"]
    in: [subject]
  # Store pickup ("Abholbestätigung", "Abholerinnerung") has no fitting order event; those
  # emails give the order without an event.
  - event: order_confirmed
    patterns: ["eingegangen|^bestätigung|bestätigung deiner bestellung"]
    in: [subject]
require: [order_number]
tests:
  - fixture: mediamarkt-order.eml
    expect:
      - ruleId: order-mediamarkt
        total: { amount: 19.99, currency: EUR }
        kind: order
        event: order_confirmed
        orderNumbers: ["123456789"]
        items: ["EXAMPLE microSD-Karte 128 GB"]
  - fixture: mediamarkt-soon.eml
    expect:
      - ruleId: order-mediamarkt
        event: order_shipped
        orderNumbers: ["123456789"]
      - ruleId: parcel-mediamarkt
        carrier: dhl
        trackingNumbers: ["340011223348"]
        orderNumbers: ["123456789"]
