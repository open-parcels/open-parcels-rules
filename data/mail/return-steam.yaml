# yaml-language-server: $schema=../../schema/mail-rule.schema.json
id: return-steam
name: Steam refund requests and refunds
kind: return
senders:
  addresses: [noreply@steampowered.com]
subject:
  - "refund|rückerstattung|erstattet"
extract:
  item:
    - pattern: '^(?<item>[^\s<][^\n<]{1,119}?)\s*- playtime'
      flags: [i, m]
    # Refund requests: the name sits above "Purchased:" (no colon, unlike "- Playtime: 41 min").
    - pattern: '^(?<item>[^\s<&][^\n<:&]{1,119}?)[ \t]*(?:[ \t]*\n){1,3}(?:purchased|gekauft):'
      flags: [i, m]
event_keywords:
  - event: refund_issued
    patterns: ["has been refunded|wurde erstattet"]
    in: [subject]
  - event: return_started
    patterns: ["refund request|rückerstattungsanfrage"]
    in: [subject]
tests:
  - fixture: steam-refunded.eml
    expect:
      - ruleId: return-steam
        kind: return
        event: refund_issued
        items: ["Example Space Game"]
